version: '3.8'

services:
  backend:
    build: ./todo-api-nest
    container_name: nestjs_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_HOST=mongo-db
      - MONGO_PORT=27017
      - MONGO_DB_NAME=todo-db
      - MONGO_URI=mongodb://mongo-db:27017/todo-db
    networks:
      - todoProyect
    restart: always

  frontend:
    build: ./frontendTodoVue
    container_name: vue_frontend
    ports:
      - "8080:5173"
    depends_on:
      - backend
    networks:
      - todoProyect
    restart: always

networks:
  todoProyect:
    external: true
