version: '3.8'

services:
  backend:
    build:
      context: ./todo-api-nest
      dockerfile: Dockerfile.dev
    container_name: nestjs_backend
    ports:
      - "3000:3000"
    volumes:
      - ./todo-api-nest:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    environment:
      - PORT=3000
      - MONGO_HOST=mongo-db
      - MONGO_PORT=27017
      - MONGO_DB_NAME=todo-db
      - MONGO_URI=mongodb://mongo-db:27017/todo-db
    networks:
      - todoProyect
    restart: always

  frontend:
    build: ./frontendTodoVue
    container_name: vue_frontend
    ports:
      - "8080:5173"
    volumes:
      - ./frontendTodoVue:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - todoProyect
    restart: always

networks:
  todoProyect:
    external: true
